name: "Setup vcpkg and configure"
description: >
  Sets up vcpkg with binary caching to the GitHub Actions cache, then runs the
  CMake configure step with retries so a transient dependency-download failure
  retries instead of failing the whole job.

inputs:
  preset:
    description: "CMake configure preset to run."
    required: true
  vcpkg-commit:
    description: "vcpkg baseline commit to pin."
    required: false
    default: "66c0373dc7fca549e5803087b9487edfe3aca0a1"
  attempts:
    description: "Number of configure attempts before giving up."
    required: false
    default: "3"

runs:
  using: "composite"
  steps:
    # Point vcpkg's default (files) binary cache at a fixed directory and
    # persist it across runs with actions/cache, so dependencies are restored
    # as prebuilt binaries instead of rebuilt from source every run. This
    # replaces vcpkg's removed 'x-gha' backend; no NuGet feed required.
    - name: Prepare vcpkg binary cache directory
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const dir = path.join(process.env.RUNNER_TEMP, 'vcpkg-binary-cache');
          fs.mkdirSync(dir, { recursive: true });
          core.exportVariable('VCPKG_DEFAULT_BINARY_CACHE', dir);

    - name: Cache vcpkg binary archives
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        # Rebuilt deps depend on the OS, the vcpkg baseline, and the manifest.
        key: vcpkg-${{ runner.os }}-${{ inputs.vcpkg-commit }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ inputs.vcpkg-commit }}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.6
      with:
        vcpkgGitCommitId: ${{ inputs.vcpkg-commit }}

    # Configure runs in each platform's native shell. Bash on Linux/macOS; on
    # Windows the MSVC setup exports a Windows-format PATH (C:\a;C:\b) that Git
    # Bash mangles by splitting on ':' (hiding ninja/cl), so use pwsh there -
    # the same shell the Windows build/test steps already run under. vcpkg
    # resumes from cache, so a transient download failure just needs a retry.
    - name: Configure
      if: runner.os != 'Windows'
      shell: bash
      run: |
        attempts="${{ inputs.attempts }}"
        for attempt in $(seq 1 "$attempts"); do
          echo "::group::Configure attempt $attempt/$attempts"
          cmake --preset "${{ inputs.preset }}" && { echo "::endgroup::"; exit 0; }
          echo "::endgroup::"
          echo "Configure attempt $attempt failed; retrying in $((attempt * 15))s..."
          sleep $((attempt * 15))
        done
        echo "Configure failed after $attempts attempts"; exit 1

    - name: Configure
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Don't let cmake's non-zero exit throw a terminating error: we inspect
        # $LASTEXITCODE ourselves so the loop can retry instead of aborting.
        $ErrorActionPreference = 'Continue'
        $PSNativeCommandUseErrorActionPreference = $false

        $attempts = [int]'${{ inputs.attempts }}'
        for ($i = 1; $i -le $attempts; $i++) {
          Write-Host "::group::Configure attempt $i/$attempts"
          cmake --preset '${{ inputs.preset }}'
          $code = $LASTEXITCODE
          Write-Host "::endgroup::"
          if ($code -eq 0) { exit 0 }
          $delay = $i * 15
          Write-Host "Configure attempt $i failed; retrying in ${delay}s..."
          Start-Sleep -Seconds $delay
        }
        Write-Host "Configure failed after $attempts attempts"
        exit 1
